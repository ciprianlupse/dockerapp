name: Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t chipln/docker101tutorial:latest -t chipln/docker101tutorial:${{ env.IMAGE_TAG }} .

      - name: Push image
        run: |
          docker push chipln/docker101tutorial:latest
          docker push chipln/docker101tutorial:${{ env.IMAGE_TAG }}

  deploy: 
    runs-on: self-hosted
    needs: docker

    steps: 
      - name: Deploy locally on VM
      - run:  ~/deploy.sh
